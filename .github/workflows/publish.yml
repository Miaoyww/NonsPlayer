name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            plugins/netease-island/backend -> target

      - name: Validate release version and notes
        run: python scripts/release.py notes $env:RELEASE_TAG .local/release-notes.md

      - name: Install frontend dependencies
        run: |
          pnpm --dir app install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir plugins/netease-download install --frozen-lockfile

      - name: Install adapter build dependencies
        run: |
          npm ci --prefix adapters/gdstudio --include=dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix packages/wasm-crypto --include=dev

      - name: Install adapter composition tool
        run: cargo install wac-cli --version 0.12.0 --locked --root .local/tools

      - name: Check formatting
        run: pnpm --dir app format:check

      - name: Test release scripts
        run: python -m unittest discover -s scripts/tests

      - name: Install plugin compiler
        run: cargo install cargo-component --version 0.21.1 --locked

      - name: Build plugins
        run: pnpm --dir app plugins:build

      - name: Fetch telemetry statistics snapshot
        env:
          NONS_TELEMETRY_STATS_KEY: ${{ secrets.NONS_TELEMETRY_STATS_KEY }}
        run: |
          if (-not $env:NONS_TELEMETRY_STATS_KEY) { throw 'Missing NONS_TELEMETRY_STATS_KEY' }
          $uri = 'https://nons-api.miaoyww.top/v1/summary'
          $delays = @(0, 2, 5)
          $response = $null
          $lastError = $null
          for ($attempt = 0; $attempt -lt $delays.Count; $attempt++) {
            if ($delays[$attempt] -gt 0) { Start-Sleep -Seconds $delays[$attempt] }
            try {
              $response = Invoke-WebRequest -Uri $uri -Headers @{ 'X-Stats-Key' = $env:NONS_TELEMETRY_STATS_KEY } -TimeoutSec 10 -UseBasicParsing
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) { break }
              if ($response.StatusCode -ne 429 -and $response.StatusCode -lt 500) { throw "Telemetry summary request failed with HTTP $($response.StatusCode)" }
              $lastError = "HTTP $($response.StatusCode)"
            } catch {
              $lastError = $_.Exception.Message
              $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
              if ($status -and $status -ne 429 -and $status -lt 500) { throw }
              if ($attempt -eq $delays.Count - 1) { throw "Telemetry summary request failed after retries: $lastError" }
            }
          }
          if (-not $response -or $response.StatusCode -lt 200 -or $response.StatusCode -ge 300) { throw "Telemetry summary request failed after retries: $lastError" }
          try { $summary = $response.Content | ConvertFrom-Json } catch { throw 'Telemetry summary response is not valid JSON' }
          $usageText = [string]$summary.usage_count
          $playsText = [string]$summary.play_count
          $generated = [string]$summary.generated_at
          if ($usageText -notmatch '^[0-9]+$' -or $playsText -notmatch '^[0-9]+$' -or [string]::IsNullOrWhiteSpace($generated)) { throw 'Telemetry summary response is invalid' }
          $usage = [long]$usageText
          $plays = [long]$playsText
          @(
            "VITE_TELEMETRY_USAGE_COUNT=$usage"
            "VITE_TELEMETRY_PLAY_COUNT=$plays"
            "VITE_TELEMETRY_STATS_GENERATED_AT=$generated"
          ) | Set-Content -Encoding utf8 app/.env.production.local

      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NONS_TELEMETRY_INGEST_KEY: ${{ secrets.NONS_TELEMETRY_INGEST_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY' }
          if (-not $env:NONS_TELEMETRY_INGEST_KEY) { throw 'Missing NONS_TELEMETRY_INGEST_KEY' }
          pnpm --dir app build:release
          Remove-Item -Force app/.env.production.local

      - name: Build portable archive
        run: python scripts/release.py portable $env:RELEASE_TAG app/src-tauri/target/release/bundle/portable

      - name: Collect release files and checksums
        run: python scripts/release.py files $env:RELEASE_TAG .local/release-files

      - name: Generate signed updater feed
        run: python scripts/update-manifest.py $env:RELEASE_TAG .local/release-files .local/release-notes.md --base-url "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG" --checksum

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nons-windows-x64
          path: .local/release-files/*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, build_android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py notes "$RELEASE_TAG" .local/release-notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nons-windows-x64
          path: artifacts

      - name: Verify artifact checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes-file .local/release-notes.md
          else
            gh release create "$TAG" --repo "$REPO" --title "Nons $TAG" \
              --verify-tag --draft --notes-file .local/release-notes.md
          fi
          for file in artifacts/*; do
            gh release upload "$TAG" "$file" --repo "$REPO" --clobber
          done
          gh release edit "$TAG" --repo "$REPO" --draft=false

      - name: Generate mirror updater feed
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/update-manifest.py "$RELEASE_TAG" artifacts .local/release-notes.md --base-url "https://download.miaoyww.top/nons/releases/$RELEASE_TAG" --output .local/r2-latest.json

      - name: Install R2 upload client
        run: python -m pip install 'awscli>=1.35,<2'

      - name: Publish immutable assets then mirror updater feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY}"
          : "${R2_ACCOUNT_ID:?Missing R2_ACCOUNT_ID}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp artifacts/ "s3://veto/nons/releases/$RELEASE_TAG/" --recursive \
            --endpoint-url "$endpoint" --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp .local/r2-latest.json "s3://veto/nons/releases/latest.json" \
            --endpoint-url "$endpoint" --content-type 'application/json' --cache-control 'no-cache'
