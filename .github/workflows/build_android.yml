name: Build Android and Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_android:
    name: Build Android ARM64 APK
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: android-arm64

      - name: Validate release version and notes
        run: python scripts/release.py notes $env:RELEASE_TAG .local/release-notes.md

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Test release scripts
        run: python -m unittest discover -s scripts/tests

      - name: Prepare Android SDK
        run: python scripts/bootstrap-android.py --accept-licenses

      - name: Build and verify Android APK
        run: pnpm --dir app build:android

      - name: Collect Android APK and checksum
        run: python scripts/release.py android-files $env:RELEASE_TAG .local/android-release-files

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nons-android-arm64
          path: .local/android-release-files/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  check_linux:
    name: Check Linux compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libdbus-1-dev \
            libfontconfig-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: linux-check

      - name: Check Rust compilation
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --lib --locked
