name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_frontend:
    name: Test frontend
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Test frontend
        run: pnpm --dir app test

  test_release_scripts:
    name: Test release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release scripts
        run: python -m unittest discover -s scripts/tests

  test_native_library:
    name: Test native library
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      FFMPEG_MODE: bundled
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            plugins/runtime-fixture/backend -> target
            plugins/music-fixture/backend -> target

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Validate LLVM for FFmpeg bindings
        run: |
          if (-not (Test-Path -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) {
            throw "libclang.dll not found under LIBCLANG_PATH: $env:LIBCLANG_PATH"
          }

      - name: Install cargo-component
        run: cargo install cargo-component --version 0.21.1 --locked

      - name: Build WASM test fixtures
        run: pnpm --dir app plugins:fixtures

      - name: Test native library
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --lib --locked
