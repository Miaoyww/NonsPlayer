[package]
name = "nons"
default-run = "Nons"
version = "1.6.1"
description = "A Multiple music streaming services & High performance supported music player."
authors = ["Miaoyww"]
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "Nons"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nons_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
plugin-probe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-controller = { version = "0.25", features = ["v1_24"] }
gst-plugin-reqwest = { path = "vendor/gst-plugin-reqwest", default-features = false, features = ["static", "rustls-ring"] }
nons-music-adapter-sdk = { path = "../../packages/music-adapter-sdk" }
nons-adapter-netease = { path = "../../adapters/netease" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
moka = { version = "0.12", features = ["future"] }
tokio = { version = "1", features = ["sync", "time", "fs", "macros"] }
rusqlite = { version = "0.38", features = ["bundled"] }
lofty = "0.25"
cue_lib = "0.1.0"
encoding_rs = "0.8"
ncmdump = { path = "vendor/ncmdump" }
tempfile = "3"
url = "2"
sha2 = "0.10"
fastrand = "2"
walkdir = "2"
notify = "8"
quick-xml = "0.39"
html-escape = "0.2.15"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
base64 = "0.22"
regex = "1"
flate2 = "1"
hex = "0.4"
wasmtime = { version = "=46.0.1", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "async", "cache", "parallel-compilation"] }
wasmtime-wasi = { version = "=46.0.1", default-features = false, features = ["p2"] }
rayon = "1.11"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
semver = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
percent-encoding = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
jsonschema = { version = "0.46", default-features = false }
cap-std = "4"
image = { version = "0.25", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
font-kit = "0.14"
clipboard-rs = { version = "=0.3.5", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }

[dev-dependencies]
aes = "0.8"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
clipboard-win = { version = "5.4", features = ["monitor"] }
windows = { version = "0.62", features = ["Foundation", "Media", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Media_Audio"] }
keyring = { version = "3.6", features = ["windows-native"] }
sysproxy = "0.3"
glob = "0.3"
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service"] }


# 保留开发代码回溯所需的行号，减少依赖调试信息的磁盘占用。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Keep host debugging while optimizing the compiler that runs during WASM loading.
[profile.dev.package.wasmtime]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
