[package]
name = "nons-adapter-netease"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
[dependencies]
nons-music-adapter-sdk = { path = "../../packages/music-adapter-sdk" }
ncm-api-rs = { path = "vendor/ncm-api-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
base64 = "0.22"
url = "2"
cookie = "0.18"
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
