[package]
name = "nons-adapter-jbsou"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nons-music-adapter-sdk = { path = "../../packages/music-adapter-sdk" }
serde_json = "1"
url = "2"
lofty = "0.25"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
