[package]
name = "nons-adapter-jbsou"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata.component]
package = "nons:jbsou"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nons-music-web-provider = { path = "../../packages/music-web-provider" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.41"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
