        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 24px 0;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 20px;
        background: #152b43;
        color: white;
        font: inherit;
        cursor: pointer;
        min-height: 44px;

      .secondary {
        background: white;
        color: #152b43;
        border: 1px solid #c7d5e4;
      }

      #preview svg {

        width: 100%;

      #status {

      #file {

      </div>
      <div class="actions">
        <button id="png" type="button">下载 PNG</button>
        <button id="svg" type="button" class="secondary">下载 SVG</button>
        <button id="load" type="button" class="secondary">载入 SVG</button>
        <input id="file" type="file" accept=".svg,image/svg+xml" />
      </div>
      <p id="status" role="status">
        修改后请覆盖保存 header.svg 和 header.png；此页面不会自动写回文件。
      </p>
    </main>
    <script>
      const fields = ['version', 'subtitle', 'platform', 'release-kind']
      const preview = document.getElementById('preview')
      const status = document.getElementById('status')
      const field = (id) => document.getElementById('edit-' + id)
      function update() {
        const svg = preview.querySelector('svg')
        for (const id of fields) svg.querySelector('#' + id).textContent = field(id).value
        svg.querySelector('title').textContent =
          'NonsPlayer ' + field('version').value + ' 发布头图'
        svg.querySelector('desc').textContent = [
          '蓝白扁平设计',
          ...fields.map((id) => field(id).value)
        ].join('，')
        const overflow = fields.some((id) => svg.querySelector('#' + id).getBBox().width > 640)
        status.textContent = overflow
          ? '文字较长，可能超出区域，请缩短后再导出。'
          : '预览已更新。下载 SVG 可保存本次修改。'
      }
      for (const id of fields) field(id).addEventListener('input', update)
      function source() {
        return new XMLSerializer().serializeToString(preview.querySelector('svg'))
      }
      function save(blob, extension) {
        const link = document.createElement('a')
        const url = URL.createObjectURL(blob)
        link.href = url
        link.download = 'header.' + extension
        link.click()
        setTimeout(() => URL.revokeObjectURL(url), 1000)
      }
      document
        .getElementById('svg')
        .addEventListener('click', () =>
          save(new Blob([source()], { type: 'image/svg+xml;charset=utf-8' }), 'svg')
        )
      document.getElementById('png').addEventListener('click', async () => {
        const button = document.getElementById('png')
        button.disabled = true
        let url
        try {
          await document.fonts.ready
          url = URL.createObjectURL(new Blob([source()], { type: 'image/svg+xml;charset=utf-8' }))
          const image = new Image()
          image.src = url
          await image.decode()
          const canvas = document.createElement('canvas')
          canvas.width = 1600
          canvas.height = 800
          canvas.getContext('2d').drawImage(image, 0, 0, 1600, 800)
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'))
          if (!blob) throw new Error('PNG 导出失败')
          save(blob, 'png')
          status.textContent = 'PNG 已导出，尺寸 1600 × 800。'
        } catch (error) {
          status.textContent = '导出失败：' + error.message
        } finally {
          if (url) URL.revokeObjectURL(url)
          button.disabled = false
        }
      })
      document
        .getElementById('load')
        .addEventListener('click', () => document.getElementById('file').click())
      document.getElementById('file').addEventListener('change', async (event) => {
        const file = event.target.files[0]
        if (!file) return
        try {
          if (file.size > 8 * 1024 * 1024) throw new Error('请使用本编辑器导出的 SVG')
          const doc = new DOMParser().parseFromString(await file.text(), 'image/svg+xml')
          if (doc.querySelector('parsererror') || doc.documentElement.localName !== 'svg')
            throw new Error('无效 SVG')
          // Only import text into the existing artwork; never execute imported markup.
          const values = fields.map((id) => {
            const text = doc.querySelector('#' + id)
            if (!text || text.localName !== 'text') throw new Error('缺少发布头图文字层')
            return text.textContent
          })
          fields.forEach((id, index) => {
            field(id).value = values[index].slice(0, field(id).maxLength)
          })
          update()
        } catch (error) {
          status.textContent = '载入失败：' + error.message
        }
        event.target.value = ''
      })
    </script>
  </body>
